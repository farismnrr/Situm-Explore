name: Publish container images

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit SHA or ref to build
        required: true
        default: main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Resolve source revision
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          full_sha=$(git rev-parse HEAD)
          short_sha=${full_sha:0:12}
          echo "full_sha=${full_sha}" >> "$GITHUB_OUTPUT"
          echo "runtime_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "migration_tag=migrate-sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/farismnrr/situm-explore:${{ steps.meta.outputs.runtime_tag }}
          build-args: |
            OCI_REVISION=${{ steps.meta.outputs.full_sha }}
            OCI_VERSION=${{ steps.meta.outputs.runtime_tag }}

      - name: Publish migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migration
          push: true
          platforms: linux/amd64
          tags: ghcr.io/farismnrr/situm-explore:${{ steps.meta.outputs.migration_tag }}
          build-args: |
            OCI_REVISION=${{ steps.meta.outputs.full_sha }}
            OCI_VERSION=${{ steps.meta.outputs.migration_tag }}
