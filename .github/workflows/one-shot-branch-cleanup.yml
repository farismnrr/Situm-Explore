name: One-shot branch cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every remote branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting $branch"
            encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
            gh api -X DELETE "repos/${REPO}/git/refs/heads/${encoded}"
          done
